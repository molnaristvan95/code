    <script type="text/javascript">
     const create = (c) => {
      return document.createElement(c);
     },
     append = (par, chil) => {
      return par.appendChild(chil);
     },
     node = (variable, t) => {
      let txt = document.createTextNode(t);
      variable.appendChild(txt);
      return;
     },
     event = (target, triger, func) => {
      return target.setAttribute(triger, func);
     },
     substr = (a, b, c) => {
      if (Number.isInteger(b) && Number.isInteger(c)) {
       return a.substring(b, c);
      } else {
       return a.substring(1);
      }
     },
     $ = (e) => {
      let elem;
      if (e[0] == '#') {
       let x = substr(e);
       elem = document.getElementById(x);
      } else if (e[0] == '.') {
       let x = substr(e);
       elem = document.getElementsByClassName(x);
      } else if (e[0] == 'n') {
       let x = substr(e);
       elem = document.getElementsByName(x);
      } else if (e[0] == 't') {
       let x = substr(e);
       elem = document.getElementsByTagName(x);
      }
      return elem;
     },
     html = (el, h) => {
      if (!h) {
       return el.innerHTML;
      } else {
       return el.innerHTML = h;
      }
     },
     css = (el, c) => {
      let separ = c.split(';');
      return el.style[separ[0]] = separ[1];
     };

  substr = (a, b, c) => {
   if (Number.isInteger(b) && Number.isInteger(c)) {
    return a.substring(b, c);
   } else {
    return a.substring(1);
   }
  },
  $ = (e) => {
   let elem;
   if (e[0] == '#') {
    let x = substr(e);
    elem = document.getElementById(x);
   } else if (e[0] == '.') {
    let x = substr(e);
    elem = document.getElementsByClassName(x);

    elem = document.getElementsByName(x);
   } else if (e[0] == 't') {
    let x = substr(e);
    elem = document.getElementsByTagName(x);

  },
  html = (el, h) => {
   if (!h) {
    return el.innerHTML;
   } else {
    return el.innerHTML = h;
   }
  },
  css = (el, c) => {
   let separ = c.split(';');
   return el.style[separ[0]] = separ[1];
  };

  function insertAtCursor(textarea, text) {
   const start = textarea.selectionStart;
   const end = textarea.selectionEnd;
   const currentVal = textarea.value;

   textarea.value = currentVal.substring(0, start) + text + currentVal.substring(end);

   textarea.selectionStart = textarea.selectionEnd = start + text.length;
   textarea.focus();
  }

  function loadBasic() {
   const cleanDate = new Date().toLocaleString('hu-HU', {
    hour12: false
   });

   $('#fileName').value = cleanDate;
  }
  loadBasic();

  $('#minus').addEventListener('click', () => {
   let value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--codeFont').trim());
   let newSize = value -= 2;

   document.documentElement.style.setProperty('--codeFont', newSize+'px');
   $('#returnSize').innerHTML = newSize + 'px';

  });

  $('#plus').addEventListener('click', () => {
   let value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--codeFont').trim());
   let newSize = value += 3;

   document.documentElement.style.setProperty('--codeFont', newSize+'px');
   $('#returnSize').innerHTML = newSize + 'px';

  });

  $('#extensionIns').addEventListener('change', () => {
   $('#extension').value = $('#extensionIns').value;
  });

  let extract = 0;
  function extractTitleToFileName(textareaSelector, targetSelector) {
   if (extract === 0) {
    let textarea = document.querySelector(textareaSelector);
    if (!textarea) return "";

    let match = textarea.value.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    let titleText = match ? match[1].trim(): "";

    let target = document.querySelector(targetSelector);
    if (target) {
     let currentVal = target.value !== undefined ? target.value: target.textContent;
     let newVal = currentVal ? currentVal + "_" + titleText: titleText;

     if (target.value !== undefined) {
      target.value = newVal;
     } else {
      target.textContent = newVal;
     }
    }
    extract = 1;
    return titleText;
   }
  }

  document.querySelector('#savebtn').addEventListener('click', () => {
   extractTitleToFileName('#code', '#fileName');
  });


  function downloadCode(filename, extension) {
   const content = $('#code').value;
   const blob = new Blob([content], {
    type: 'text/plain;charset=utf-8'
   });
   const link = create('a');
   link.href = URL.createObjectURL(blob);
   link.download = filename + '.' + extension;
   append(document.body, link);
   link.click();
   link.remove();
   URL.revokeObjectURL(link.href);
  }


  //downloadCode('teszt20260715','js');
  $('#savebtn').addEventListener('click', function () {
   downloadCode($('#fileName').value, $('#extension').value);

  var o = {

    },

   genbtns: function (lang, target) {
    for (var k in this['keys'][lang]) {

     }
    }
   },
   genKeyboard: function (array, target) {
    for (var butt of array) {
     var a = create('BUTTON');
     a.type = 'button';
     append(target, a);
     node(a, butt);
     a.setAttribute('data-code', butt);

  o['genbtns']('html', $('#html'));

   if (lc === 0) {

    $('#langSwitch').innerText = '</>';

  function mainBtns() {
   const line = $('#keycenter3');

   let del = create('BUTTON'),
   shft = create('BUTTON'),
   spc = create('BUTTON'),
   back = create('BUTTON'),
   ent = create('BUTTON');

   del.type = 'button';
   shft.type = 'button';
   spc.type = 'button';
   back.type = 'button';
   ent.type = 'button';

   node(del,
    'del');
   node(shft,
    'shft');
   node(spc,
    'SPACE')
   node(back,
    'bck');
   node(ent,
    'Ent');

   append(line,
    del);
   append(line,
    shft);
   append(line,
    spc);
   append(line,
    back);
   append(line,
    ent);

   shft.counter = 0;

   shft.addEventListener('click',
    () => {
     let els = ('keycenter,keycenter1,keycenter2').split(',');
     if (shft.counter === 0) {
      shft.counter = 1;
      for (let arrs of els) {
       for (let tags of $(`#${arrs}`).children) {
        tags.innerHTML = tags.innerHTML.toUpperCase();
        tags.setAttribute('data-code', tags.getAttribute('data-code').toUpperCase());
       }
      }
     } else {
      shft.counter = 0;
      for (let arrs of els) {
       for (let tags of $(`#${arrs}`).children) {
        tags.innerHTML = tags.innerHTML.toLowerCase();
        tags.setAttribute('data-code', tags.getAttribute('data-code').toLowerCase());
       }
      }
     }
    });
   spc.addEventListener('click',
    () => {
     insertAtCursor($('#code'), ' ');
    });

   ent.addEventListener('click',
    ()=> {
     insertAtCursor($('#code'), '\n');
    });

   const ta = document.getElementById("code");

   // BACKSPACE gomb
   back.onclick = () => {
    ta.focus();
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const text = ta.value;

    if (start !== end) {
     ta.value = text.substring(0, start) + text.substring(end);
     ta.setSelectionRange(start, start);
    } else if (start > 0) {
     ta.value = text.substring(0, start - 1) + text.substring(start);
     ta.setSelectionRange(start - 1, start - 1);
    }
   };

   // DELETE gomb
   del.onclick = () => {
    ta.focus();
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const text = ta.value;

    if (start !== end) {
     ta.value = text.substring(0, start) + text.substring(end);
     ta.setSelectionRange(start, start);
    } else if (start < text.length) {
     ta.value = text.substring(0, start) + text.substring(start + 1);
     ta.setSelectionRange(start, start);
    }
   };
  }
  mainBtns();

  async function paste() {
   try {
    const text = await navigator.clipboard.readText();
    insertAtCursor($('#code'), text);
   } catch (err) {
    console.log("Clipboard read failed:", err);
   }
  }

  $('#paste').onclick = paste;
